config_version = 1
repo_root = "/home/gig/local_repos/gigvim"
rolling_branch = "rolling"
stable_branch = "main"
roll_prefix = "roll/"
version_gate = true
tag_on_promote = true
tag_on_graduate = true
push_tag = true
dev_versions = true
mode = "manage"
username = "gig"
hosts = []
# default/full/minimal each carry their own version label, so all three build.
# --no-link keeps gate runs from clobbering a ./result you're testing with.
roll_to_rolling_gates = [
  "nix flake check",
  "nix build .#default .#full .#minimal --no-link",
]
rolling_to_main_gates = [
  "nix flake check",
  "nix build .#default .#full .#minimal --no-link",
]
host_gates = []
clean_protect = []
pull_mode = "ff-only"
lazygit_command = "lazygit"
bacon_command = "bacon"
version_manifest = "npm"
claude_command = "claude"
editor_command = ""
rebuild_menu = []

[host_active]
